          legend_value: false
        data_generator: "const kind = 'live';\nconst p = entity?.attributes?.plan;\nif (!p || p.expires_at * 1000\
          \ <= Date.now()) return [];\nconst rows = Array.isArray(p.slots) ? p.slots : [], h = p.household || {},\
          \ points = [];\nfunction emit(time, value) {\n  if (points.length && points[points.length-1][0] === time)\
          \ points[points.length-1][1] = value;\n  else points.push([time,value]);\n}\nfor (const s of rows) {\n\
          \  const a = Math.max(start.getTime(), s.start * 1000), b = Math.min(end.getTime(), s.end * 1000);\n \
          \ const rate = s.display_import_price === undefined ? s.import_price : s.display_import_price;\n  if (b\
          \ <= a || !Number.isFinite(rate)) continue;\n  emit(a,null);\n  const matches = kind === 'live' ? ['flat','running_average','time_of_use','external_live'].includes(s.price_source)\n\
          \    : kind === 'forecast' ? ['day_ahead','external_forecast'].includes(s.price_source)\n     : kind ===\
          \ 'estimate' ? s.price_source === 'recorded_estimate' : Number.isFinite(h.best_start) && Number.isFinite(h.best_end);\n\
          \  let left = a, right = b;\n  if (kind === 'suggested') { left = Math.max(a, h.best_start * 1000); right\
          \ = Math.min(b, h.best_end * 1000); }\n  if (matches && right > left) { emit(left,rate*100); emit(right-1,rate*100);\
          \ emit(right,null); }\n  emit(b,null);\n}\nreturn points;"
