        state: 'on'
      card:
        type: grid
        columns: 2
        square: false
        cards:
        - type: tile
          entity: sensor.nrg_ev_actual_status
          name: Charging status
          tap_action:
            action: more-info
          hold_action:
            action: none
          icon_tap_action:
            action: more-info
        - type: tile
