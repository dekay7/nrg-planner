- title: Components
  path: components
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Vehicle
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### This home has an EV


          Enable vehicle monitoring and its dashboard cards. Leave off if you have no EV; EV readings, controls
          and calibration will not be required.'
      - type: entities
        entities:
        - entity: switch.nrg_has_ev
          name: EV installed
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Let NRG control EV charging


          Optional. Enable after mapping your charging switch/current controls or HA command scripts. With this
          off, NRG monitors the car and leaves its charging to your existing system.'
      - type: entities
        entities:
        - entity: switch.nrg_ev_control
          name: Control EV charging
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Home battery
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### This home has a stationary battery


          Enable battery monitoring and capacity estimates. Leave off if you have no home battery; battery sensors,
          reserve and operating controls will not be required.'
      - type: entities
        entities:
        - entity: switch.nrg_has_battery
          name: Battery installed
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Let NRG control the home battery


          Optional. Enable after mapping the battery''s operating controls or command scripts. With this off, the
          battery remains monitored and NRG does not assume it can schedule its energy.'
      - type: entities
        entities:
        - entity: switch.nrg_battery_control
          name: Control battery
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Solar
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### This home has solar


          Enable solar production, forecasts and their dashboard cards. Leave off for a home without panels; the
          planner then knows solar production is zero.'
      - type: entities
        entities:
        - entity: switch.nrg_has_solar
          name: Solar installed
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  dense_section_placement: false
- title: Tariff
  path: tariff
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Pricing setup
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: '### Independent supply and delivery


        Choose each pricing method separately. To add Morning / Peak / Evening / Overnight or weekday/weekend rates,
        open **Configure → Pricing periods**. Missing hours/rates stay unknown; they are not treated as free.'
      grid_options:
        columns: full
        rows: auto
    - type: button
      name: Open NRG Planner configuration
      show_icon: false
      tap_action: &id001
        action: navigate
        navigation_path: /config/integrations/integration/nrg
      grid_options:
        columns: full
        rows: 1
    - type: markdown
      content: '### Pricing schedule coverage


        {{ states(''sensor.nrg_tariff_status'') }}'
      tap_action:
        action: more-info
        entity: sensor.nrg_tariff_status
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Supply pricing
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Supply plan


          Choose your provider''s supply pricing: a flat rate, your own timed periods, an external HA price sensor/forecast,
          or the optional ComEd hourly feed. Delivery is configured separately and added once.'
      - type: entities
        entities:
        - entity: select.nrg_supply_plan
          name: Supply plan
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Flat supply rate


          Your contracted supply price, excluding delivery. Unset means unknown, not free. Enter an explicit zero
          only if your contract really has a zero supply rate.'
      - type: entities
        entities:
        - entity: number.nrg_flat_supply_cents
          name: Supply
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Supply forecast attribute


          For an external provider, name the attribute containing forecast intervals. Each interval needs start,
          end and price (or the documented aliases). Units are read from the row or price entity. An external current
          price alone does not invent future prices.'
      - type: entities
        entities:
        - entity: text.nrg_external_supply_attribute
          name: Forecast attribute
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Delivery pricing
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Delivery plan


          Delivery can have its own flat rate, timed periods or external sensor. Its schedule need not match the
          supply schedule. Edit periods under Configure → Pricing periods.'
      - type: entities
        entities:
        - entity: select.nrg_delivery_plan
          name: Delivery plan
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Flat delivery rate


          Your variable delivery/rider cost in cents per imported kWh. Include applicable variable riders, not fixed
          monthly fees. Unset means unknown; explicitly enter zero if no separate delivery charge applies.'
      - type: entities
        entities:
        - entity: number.nrg_delivery_cents
          name: Delivery
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Delivery forecast attribute


          Attribute containing external delivery-price intervals. Supply and delivery forecasts are independent.
          See the handbook''s supported interval fields and units.'
      - type: entities
        entities:
        - entity: text.nrg_external_delivery_attribute
          name: Forecast attribute
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Export credits
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Export credit basis


          Configure how exported energy is credited; do not assume exports receive the import delivery rate. Credits
          may have billing restrictions not modeled here.'
      - type: entities
        entities:
        - entity: select.nrg_export_rate
          name: Export credit basis
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Export credit adder


          Added to the selected supply price only for Supply plus adder exports. Enter your own export agreement''s
          value, including an explicit zero if appropriate. Unset means unknown.'
      - type: entities
        entities:
        - entity: number.nrg_export_adder_cents
          name: Adder
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Flat export credit


          Credit per exported kWh when Flat credit is selected. Independent of your buying rate. Enter your own
          value; unset means unknown.'
      - type: entities
        entities:
        - entity: number.nrg_flat_export_cents
          name: Credit
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Export policy


          Solar only allows solar exports; Battery also allows stored energy exports; No exports requests neither.
          NRG sends this preference only when a matching control is configured. Otherwise set the same policy in
          your equipment. Permission alone does not force a sale.'
      - type: entities
        entities:
        - entity: select.nrg_export_policy
          name: Export policy
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  dense_section_placement: false
- title: Solar
  path: solar
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Solar
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: Solar is not enabled for this home. [Open Components](/nrg-settings/components) to enable it when
        you have that equipment.
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_solar
      state: 'off'
  - type: grid
    cards:
    - type: heading
      heading: Age correction
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Solar installation date


          Used for panel age when a source has Apply age correction enabled. Leave unset until known; no age correction
          is invented. Measured solar is never reduced.


          Tap the card below to edit.'
      - type: tile
        entity: date.nrg_solar_install_date
        name: Installation date
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Solar annual degradation


          Compounded yearly reduction in an unadjusted forecast: (1 − rate/100)^age. Sources already calibrated
          to present output should have age correction off.'
      - type: entities
        entities:
        - entity: number.nrg_solar_degradation
          name: Degradation
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_solar
      state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Forecast calibration
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Solar forecast calibration


          Compare the forecast saved before each daylight hour with what your solar meter later measured. After
          six well-measured daylight hours, NRG adjusts future forecasts by actual ÷ forecast, using up to 168 recent
          daylight hours. For example, consistently producing 8 kWh when 10 kWh was forecast gives about a 0.8 multiplier.
          The correction is limited to 0.5–1.5. It changes predictions, never measured production or panel settings.'
      - type: entities
        entities:
        - entity: switch.nrg_solar_learning
          name: Calibrate forecasts
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_solar
      state: 'on'
  dense_section_placement: false
- title: Battery
  path: battery
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Battery
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: Battery is not enabled for this home. [Open Components](/nrg-settings/components) to enable it when
        you have that equipment.
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_battery
      state: 'off'
  - type: grid
    cards:
    - type: heading
      heading: Capacity and age
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Battery capacity at installation


          Generic starting assumption: replace with your equipment''s full-charge capacity before backup reserve.
          The age estimate reduces this number; reserve and conversion losses are applied separately.'
      - type: entities
        entities:
        - entity: number.nrg_battery_capacity
          name: Capacity
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Battery installation date


          Baseline date for the capacity entered above. If capacity is a current measured value, use its measurement
          date. An unset date applies no age adjustment.


          Tap the card below to edit.'
      - type: tile
        entity: date.nrg_battery_install_date
        name: Installation date
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Battery annual degradation


          Compounded yearly reduction of estimated full-charge capacity. Does not change measured SOC, power limits
          or efficiency, and is not a measured battery health result.'
      - type: entities
        entities:
        - entity: number.nrg_battery_degradation
          name: Degradation
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_battery
      state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Reserve and efficiency
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Backup reserve


          Minimum battery percentage kept out of discretionary use. NRG also sets the device''s reserve if that
          control is mapped. Configured outage/protection sensors take priority.'
      - type: entities
        entities:
        - entity: number.nrg_backup_reserve
          name: Backup reserve
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Battery round-trip efficiency


          Estimated AC-to-storage-to-AC efficiency. Equal square-root losses are applied when charging and discharging.'
      - type: entities
        entities:
        - entity: number.nrg_round_trip_efficiency
          name: Efficiency
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_battery
      state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Modeled power
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Modeled battery charging power


          Charging power used to estimate future battery energy. This setting does not directly set device watts.
          Use a conservative value supported by your equipment.'
      - type: entities
        entities:
        - entity: number.nrg_battery_charge_kw
          name: Charge power
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Modeled battery discharge power


          Discharging power used in the energy forecast. Your equipment may deliver a different rate; compare the
          forecast with its meter readings.'
      - type: entities
        entities:
        - entity: number.nrg_battery_discharge_kw
          name: Discharge
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Solar can recharge the battery while held


          Enable if the selected hold mode still accepts solar charging, as Tesla Backup normally does. Turn off
          if your inverter''s standby mode prevents solar charging too. This changes the battery forecast to match
          the device''s behavior.'
      - type: entities
        entities:
        - entity: switch.nrg_battery_solar_while_held
          name: Solar charging while held
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_battery
      state: 'on'
  dense_section_placement: false
- title: EV
  path: ev
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: EV
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: EV is not enabled for this home. [Open Components](/nrg-settings/components) to enable it when you
        have that equipment.
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_ev
      state: 'off'
  - type: grid
    cards:
    - type: heading
      heading: Schedule
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Daily EV departure


          Generic starting time: enter your own local departure. A one-off departure takes precedence. Incomplete
          connected sessions remain overdue.


          Tap the card below to edit.'
      - type: tile
        entity: time.nrg_departure_time
        name: Daily departure
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Normal charging window starts


          Start of normal daily charging availability. Review this generic window. It ends at departure; charge-now
          and deadline urgency can use time outside it.


          Tap the card below to edit.'
      - type: tile
        entity: time.nrg_ev_start_time
        name: Charging starts
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### EV completion buffer


          Aim to finish this many minutes before departure. Use the buffer if needed rather than miss the actual
          departure.'
      - type: entities
        entities:
        - entity: number.nrg_completion_buffer
          name: Buffer
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Preserve battery during EV charging


          When NRG controls both devices, ask the home battery to hold its energy while the car charges. Commands
          can take time to reach the equipment, so the battery may briefly supply the car before the hold takes
          effect. With a monitored-only battery, set that behavior in its own controller.'
      - type: entities
        entities:
        - entity: switch.nrg_hold_battery_for_ev
          name: Hold battery for EV
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_ev
      state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Charging hardware
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Maximum EV charging current


          Generic starting limit: enter a current supported by your charger and circuit. Also bounded by the control
          entity''s maximum. Script adapters need the real supported limit here. NRG never raises the vehicle''s
          selected charge limit.'
      - type: entities
        entities:
        - entity: number.nrg_ev_max_amps
          name: Maximum current
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Minimum stable EV current


          Smallest current used for solar-aware charging. Below this the car is paused. Must be no greater than
          your maximum current.'
      - type: entities
        entities:
        - entity: number.nrg_ev_min_amps
          name: Minimum current
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Conservative EV power at maximum current


          Generic starting estimate: enter your measured AC charging power at the configured maximum current. Covered
          wall-charger observations can calibrate it.'
      - type: entities
        entities:
        - entity: number.nrg_ev_kw_at_max
          name: Power at max
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### EV AC energy per percentage point


          Generic starting estimate: replace with AC energy per vehicle SOC percentage point, including losses.
          Covered charging sessions can calibrate it; this is not an EV degradation model.'
      - type: entities
        entities:
        - entity: number.nrg_ev_kwh_per_percent
          name: Energy / %
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_ev
      state: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Learning
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Calibrate EV charging estimates


          Use observed AC energy and the car''s percentage gain to estimate how much electricity charging needs.
          Sessions need at least 5 percentage points, 5 minutes and good meter coverage. NRG uses a conservative
          estimate from the last 12 sessions, and measured power per amp to improve charging-time estimates. Example:
          9 kWh for a 10-point gain suggests 0.9 kWh per point. This estimates charging needs, not EV battery degradation.
          Off uses your fallback values.'
      - type: entities
        entities:
        - entity: switch.nrg_ev_learning
          name: Calibrate charging
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Allow saved vehicle readings while plugged in


          Some MQTT/vehicle feeds publish SOC, target and settings only when they change, so their saved values
          become old while the car sleeps. Enable to accept those available saved values while the home charger
          reports connected. Connection/protection checks and command readbacks still apply. Otherwise vehicle data
          needs recent reports; an asleep feed may need its own wake/refresh automation. Estimates can be less current
          when saved readings are allowed.'
      - type: entities
        entities:
        - entity: switch.nrg_ev_allow_saved_readings
          name: Allow saved readings
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    visibility:
    - condition: state
      entity: binary_sensor.nrg_has_ev
      state: 'on'
  dense_section_placement: false
- title: Planning
  path: planning
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Household demand learning
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Learn household demand


          Learn typical home use at each clock hour from up to 28 days of meter readings. If an EV is installed,
          subtract its separately measured charging so it is not counted twice. An hour needs at least 80% valid
          coverage. Recent observations count more; weekday/weekend patterns separate after enough samples. This
          predicts ordinary demand so the battery and price advice can plan around daily life. Missing hours use
          your fallback, not zero.'
      - type: entities
        entities:
        - entity: switch.nrg_house_learning
          name: Learn house demand
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Fallback house demand without EV


          Used for clock hours without enough observations, or with learning disabled. Excludes the car to avoid
          counting it twice.'
      - type: entities
        entities:
        - entity: number.nrg_house_kw
          name: House demand
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Flexible-load advice
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Flexible appliance energy


          Energy used for household run-now versus later advice. Advice never starts an appliance.'
      - type: entities
        entities:
        - entity: number.nrg_flexible_load_kwh
          name: Energy
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Flexible appliance duration


          Contiguous running time for the reference appliance. Every suggested window must fit this whole duration.'
      - type: entities
        entities:
        - entity: number.nrg_flexible_load_minutes
          name: Duration
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Minimum worthwhile plan improvement


          Prefer a stable existing feasible plan unless a replacement improves modeled horizon cost by at least
          this amount. Also used for generic household advice.'
      - type: entities
        entities:
        - entity: number.nrg_minimum_saving_cents
          name: Improvement
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Precautions
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Optional battery cycling cost


          Optional estimated wear cost per AC kWh discharged. Calendar degradation above does not establish a cycling
          cost; zero makes no invented wear charge.'
      - type: entities
        entities:
        - entity: number.nrg_battery_wear_cents
          name: Cycling cost
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Summer peak-import precaution


          Optional regional precaution: avoid discretionary grid battery charging and, if feasible, EV charging
          on June–September weekdays noon–7 p.m. Off until explicitly enabled. It is not a predicted dollar saving;
          departure and charge-now win.'
      - type: entities
        entities:
        - entity: switch.nrg_summer_guard
          name: Summer precaution
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  dense_section_placement: false
- title: Notifications
  path: notifications
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Opt-in and threshold
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Send household advice notifications


          Opt in to stable, worthwhile wait-until recommendations. Choose notify services in Configure → Notifications.
          Notifications do not command equipment.'
      - type: entities
        entities:
        - entity: switch.nrg_notifications
          name: Send notifications
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Minimum notification benefit


          Notify only when delaying the reference appliance is expected to save at least this amount and the recommendation
          stays stable for two minutes.'
      - type: entities
        entities:
        - entity: number.nrg_notification_saving_cents
          name: Minimum benefit
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Quiet hours
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Notification quiet hours start


          Local start of quiet hours. Advice remains available on the dashboard.


          Tap the card below to edit.'
      - type: tile
        entity: time.nrg_quiet_start
        name: Quiet hours start
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Notification quiet hours end


          Local end of quiet hours. Equal start/end disables the quiet-hours restriction.


          Tap the card below to edit.'
      - type: tile
        entity: time.nrg_quiet_end
        name: Quiet hours end
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
      grid_options:
        columns: full
        rows: auto
  dense_section_placement: false
- title: Pricing periods
  path: periods
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Rate schedules
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: Supply and delivery can use different periods and weekdays. Configure → Pricing periods → Supply
        or Delivery lets you add/edit/remove periods. The four-period template leaves prices blank so no example
        price is mistaken for your real tariff.
      grid_options:
