        tap_action:
          action: more-info
        hold_action:
          action: none
        icon_tap_action:
          action: more-info
      - type: tile
        entity: sensor.nrg_grid_power
        name: Grid now
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon_tap_action:
          action: more-info
      - type: conditional
        conditions:
