    - type: markdown
      content: '{% set rows = state_attr(''sensor.nrg_tariff_status'',''delivery_periods'') or [] %}

        {% if rows %}{% for p in rows %}### {{ p.label }}


        **Time:** {{ p.start }} – {{ p.end }}


        **Rate:** {{ (p.rate_cents ~ '' ¢/kWh'') if p.rate_cents is number else ''Enter rate'' }}


        **Starting days:** {{ p.days | join('', '') }}


        {% if not loop.last %}---


        {% endif %}{% endfor %}{% else %}No timed periods configured. Use your flat rate or add periods in Configure.{%
        endif %}'
      grid_options:
        columns: full
        rows: auto
  dense_section_placement: false
- title: Control adapters
  path: controls
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Control setup
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: '### Use the integrations you already have


        NRG supports compatible HA number, select and switch entities regardless of provider, including Teslemetry,
        Tessie, MQTT and other integrations. Read-only telemetry such as TeslaMate can monitor the EV without any
        control setup. To control it, add a compatible command integration or your own HA scripts.


        Open **Configure → Mappings** for entities and **Configure → Control adapters** for device option names
        and optional scripts.'
      grid_options:
        columns: full
        rows: auto
    - type: button
      name: Open NRG Planner configuration
      show_icon: false
      tap_action: *id001
      grid_options:
        columns: full
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Script reference
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: '### What each script receives


        - `value`: the requested setting or option

        - `action`: NRG''s logical request

        - `target_soc`: battery target

        - `reserve_soc`: backup reserve

        - `export_policy`: selected export policy


        Map a feedback entity so NRG can confirm the result. A script should finish its action promptly and recheck
        ownership before any delayed equipment operation.'
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: '### Control status


        {{ states(''sensor.nrg_control_status'') }}'
      tap_action:
        action: more-info
        entity: sensor.nrg_control_status
      grid_options:
        columns: full
        rows: auto
  dense_section_placement: false
- title: Sources
  path: sources
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Measurements and forecasts
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: 'Open **Settings → Devices & services → NRG Planner → Configure**. Mappings accept entities from
        any provider. Components you do not have need no sensors.


        Solar forecasts are optional: under Sources, group alternatives for the same panels together; separate physical
        arrays add together.'
      grid_options:
        columns: full
        rows: auto
    - type: button
      name: Open NRG Planner configuration
      show_icon: false
      tap_action: *id001
      grid_options:
        columns: full
        rows: 1
    - type: conditional
      conditions:
      - entity: binary_sensor.nrg_has_solar
        state: 'on'
      card:
        type: markdown
        content: '### Forecast sources


          {{ states(''sensor.nrg_source_health'') }}'
        tap_action:
          action: more-info
          entity: sensor.nrg_source_health
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - entity: binary_sensor.nrg_has_solar
        state: 'on'
      card:
        type: markdown
        content: '{% for s in state_attr(''sensor.nrg_source_health'',''sources'') or [] %}

          ### {{ s.name }} · {{ s.group }}


          **Status:** {{ ''Ready'' if s.ready else ''Unavailable or stale'' }}


          **Entity:** {{ s.entity_id }}


          {{ s.error or '''' }}

          {% else %}No solar forecast sources configured. Add a source in Configure → Sources.

          {% endfor %}'
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Meter conventions
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Grid meter reports export as positive


          Enable when your provider reports positive export and negative import. NRG reverses that reading so its
          normalized grid power always means positive buying and negative selling.'
      - type: entities
        entities:
        - entity: switch.nrg_grid_power_inverted
          name: Reverse grid reading
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Battery meter reports charging as positive


          Enable when your provider reports positive charging and negative discharge. NRG reverses it so positive
          always means supplying the home in its own displays and model.'
      - type: entities
        entities:
        - entity: switch.nrg_battery_power_inverted
          name: Reverse battery reading
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Home meter includes EV charging


          Enable for a whole-home load meter that includes the car. Disable for a house-only circuit meter; NRG
          then adds separately measured EV power for the Home total while learning the house-only reading directly.'
      - type: entities
        entities:
        - entity: switch.nrg_home_includes_ev
          name: Home meter includes EV
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Learning observations
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: tile
      entity: sensor.nrg_house_observations
      name: Covered house hours
      tap_action:
        action: more-info
      hold_action:
        action: none
      icon_tap_action:
        action: more-info
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - entity: binary_sensor.nrg_has_solar
        state: 'on'
      card:
        type: tile
        entity: sensor.nrg_solar_error
        name: Solar forecast error
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon_tap_action:
          action: more-info
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - entity: binary_sensor.nrg_has_ev
        state: 'on'
      card:
        type: tile
        entity: sensor.nrg_ev_sessions
        name: EV charging sessions
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon_tap_action:
          action: more-info
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Reset learning


          Resetting learning removes learned profiles and forecast errors, preserving the measured-cost ledger.
          No unobserved period is filled with zero use.'
      - type: entities
        show_header_toggle: false
        entities:
        - entity: button.nrg_reset_learning
          name: Reset learning
      grid_options:
        columns: full
        rows: auto
  dense_section_placement: false
- title: Details
  path: details
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Energy and measurements
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: custom:apexcharts-card
      graph_span: 48h
      span:
        start: minute
      cache: false
      header:
        show: true
        title: Modeled energy plan · next 48 hours
      series:
      - entity: sensor.nrg_plan
        name: Solar
        unit: kW
        yaxis_id: power
        color: '#f59e0b'
        type: line
        curve: stepline
        extend_to: false
        data_generator: 'const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; if(p.components
          && !p.components.solar)return []; return (p.slots||[]).filter(s=>Number.isFinite(s.solar_kwh)).map(s=>[s.start*1000,s.solar_known
          ? s.solar_kwh / s.hours : null]);'
      - entity: sensor.nrg_plan
        name: House
        unit: kW
        yaxis_id: power
        color: '#3b82f6'
        type: line
        curve: stepline
        extend_to: false
        data_generator: const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; return
          (p.slots||[]).filter(s=>Number.isFinite(s.house_kwh)).map(s=>[s.start*1000,s.house_kwh / s.hours]);
      - entity: sensor.nrg_plan
        name: Car
        unit: kW
        yaxis_id: power
        color: '#8b5cf6'
        type: line
        curve: stepline
        extend_to: false
        data_generator: const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; if(p.components
          && !p.components.ev)return []; return (p.slots||[]).filter(s=>Number.isFinite(s.ev_kwh)).map(s=>[s.start*1000,s.ev_kwh
          / s.hours]);
      - entity: sensor.nrg_plan
        name: Battery %
        unit: '%'
        yaxis_id: soc
        color: '#22a06b'
        type: line
        curve: stepline
        extend_to: false
        data_generator: const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; if(p.components
          && !p.components.battery)return []; return (p.slots||[]).filter(s=>Number.isFinite(s.battery_soc)).map(s=>[s.start*1000,s.battery_soc]);
      yaxis:
      - id: power
        min: 0
        decimals: 1
      - id: soc
        opposite: true
        min: 0
        max: 100
      apex_config:
        chart:
          height: 300
        legend:
          showForNullSeries: false
        xaxis:
          labels:
            datetimeUTC: false
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - entity: binary_sensor.nrg_has_solar
        state: 'on'
      card:
        type: custom:apexcharts-card
        graph_span: 7d
        header:
          show: true
          title: Solar forecast versus measured hours
        series:
        - entity: sensor.nrg_observations
          name: Forecast saved before hour
          unit: kWh
          type: line
          extend_to: false
          data_generator: return (entity.attributes.hours||[]).filter(h=>Number.isFinite(h.solar_forecast)).map(h=>[h.start*1000,h.solar_forecast]);
        - entity: sensor.nrg_observations
          name: Actual covered hour
          unit: kWh
          type: line
          extend_to: false
          data_generator: return (entity.attributes.hours||[]).filter(h=>Number.isFinite(h.solar_kwh)).map(h=>[h.start*1000,h.solar_kwh]);
      grid_options:
        columns: full
        rows: auto
    - type: history-graph
      hours_to_show: 24
      entities:
      - sensor.nrg_solar_power
      - sensor.nrg_house_power
      - sensor.nrg_ev_power
      - sensor.nrg_battery_power
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Plan comparison
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: '### Why this battery action?

        {{ state_attr(''sensor.nrg_battery_action'',''reason'') }}


        **Observed status:** {{ states(''sensor.nrg_control_status'') }}


        {% set p = state_attr(''sensor.nrg_plan'',''plan'') or {} %}**Planned target:** {{ p.get(''battery_target_soc'',
        ''?'') }}% · **Candidate:** {{ p.get(''selected_candidate'', ''?'') }}


        {{ p.get(''export_capability'', '''') }}


        ### Compared schedules


        {% for c in p.get(''candidate_costs'',[]) %}**{{ c.name }}**


        Modeled horizon cost: {{ (''~'' if p.get(''cost_includes_estimates'') else '''') ~ ''$'' ~ (c.modeled_cost
        | round(2)) if c.modeled_cost is number else ''Rates needed'' }}


        EV shortfall: {{ c.shortfall_kwh | round(2) }} kWh


        {% if not loop.last %}---


        {% endif %}{% else %}Waiting for compared schedules.


        {% endfor %}

        Includes remaining-energy value and any configured cycling cost. This is a model comparison, not measured
        savings.'
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Costs and estimates
      heading_style: title
      grid_options:
        columns: full
        rows: auto
