  - type: grid
    cards:
    - type: power-sankey
      title: Current power flow
      layout: auto
      show_values: true
      group_by_area: false
      group_by_floor: false
      collection_key: energy_dashboard
      grid_options:
        columns: full
    - type: markdown
      content: The same live power-flow Sankey as the Energy dashboard's Now tab. Configure your power meters in
        the Energy dashboard; NRG never substitutes an estimated flow.
      grid_options:
        columns: full
    - type: grid
      columns: 2
      square: false
      cards:
      - type: conditional
        conditions:
        - entity: binary_sensor.nrg_has_solar
          state: 'on'
        card:
          type: tile
          entity: sensor.nrg_solar_power
          name: Solar now
          tap_action:
