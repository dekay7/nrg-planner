        noData:
          text: Waiting for a complete hourly plan · see details below
    - type: markdown
      content: '{% set p = state_attr(''sensor.nrg_plan'',''plan'') or {} %}

        {% set h = state_attr(''sensor.nrg_plan'',''hourly'') or {} %}

        {% macro energy(v) %}{{ (v | round(2) ~ '' kWh'') if v is number else ''Unknown'' }}{% endmacro %}

        {% if p.get(''expires_at'', 0) <= as_timestamp(now()) or not h.get(''rows'') %}

        **Waiting for a fresh home energy plan.** {{ h.get(''reason'', ''Update the integration and dashboard together
        if hourly details are missing.'') }}

        {% else %}

        **{{ ''Proposed schedule · Observation, no commands sent'' if state_attr(''sensor.nrg_plan'',''operating_mode'')
        == ''Observation'' else ''Selected schedule · subject to device checks, not measured delivery'' }}**


        Updated {{ p.generated_at | timestamp_custom(''%H:%M %Z'') }} · {{ h.timezone }}. The two charts have independent
        linear kWh scales so charging peaks do not flatten household flows. Compare axis values, not heights between
        charts. House demand excludes the EV; grid import is the whole site''s total, not an extra amount to add
        to charging. Flows are not stacked or netted.


        Points/bars show kWh per interval, not instantaneous kW. Current/final hours can be partial; hover/tap for
        amounts and open an hour below for exact actions.


        {% if h.get(''fallback_active'') %}**Price-data fallback baseline.** The outlook assumes fallback continues
        until recovery; prices and recovery time may be unknown.

        {% elif p.get(''economic_until'', 0) < h.get(''end'', 0) %}**Limited economic coverage.** Later hours are
        a conservative outlook, not a price-optimized schedule. Battery hold after dependable coverage can still
        accept solar when configured.

        {% endif %}

        {% if h.get(''status'') == ''partial'' %}**Incomplete outlook.** Incomplete hours are gaps in the graph,
        not zero energy. Independently known values and missing-input reasons remain in hourly details.

        {% set ns = namespace(reasons=[]) %}{% for row in h.rows %}{% for reason in row.reasons %}{% if reason not
        in ns.reasons %}{% set ns.reasons = ns.reasons + [reason] %}{% endif %}{% endfor %}{% endfor %}

        {% for reason in ns.reasons %}- {{ reason }}

        {% endfor %}{% endif %}

        {% set first = h.rows[0] %}**Current-hour remainder:** grid import {{ energy(first.import_kwh) }}{% if p.components.get(''battery'')
        %} · battery supply {{ energy(first.battery_discharge_kwh) }} · battery charging {{ energy(first.battery_charge_kwh)
        }}{% endif %}.


        {% if h.get(''next_actions'') %}### Next planned actions

        {% for action in h.next_actions %}- {{ action.text }}

        {% endfor %}{% endif %}

        <details><summary><strong>Hourly plan details · {{ h.timezone }}</strong></summary>


        Energy totals use interval averages, prorated at the displayed boundaries. Actions retain exact times; this
        is not a promise of constant power. Battery charging and supply, and grid import and export, are not netted.
        Save battery may accept solar; Supply home may deliver nothing when solar or reserve covers the need.


        {% if p.components.get(''ev'') %}**EV basis:** {{ h.get(''ev_basis'') }}. Monitoring-only equipment follows
        its own controls; future plug-ins are not predicted.


        {% endif %}{% for row in h.rows %}<details><summary>{{ row.label }} · {{ row.minutes | round(1) }} min{{
        '' · incomplete'' if not row.complete else '''' }}</summary>


        **Supply:** grid {{ energy(row.import_kwh) }}{% if p.components.get(''solar'') %} · solar {{ energy(row.solar_kwh)
        }}{% endif %}{% if p.components.get(''battery'') %} · battery {{ energy(row.battery_discharge_kwh) }}{%
        endif %}.


        **Use:** house {{ energy(row.house_kwh) }}{% if p.components.get(''ev'') %} · EV {{ energy(row.ev_kwh) }}{%
        endif %}{% if p.components.get(''battery'') %} · battery charging {{ energy(row.battery_charge_kwh) }} (solar
        {{ energy(row.solar_charge_kwh) }}, grid {{ energy(row.grid_charge_kwh) }}){% endif %}{% if p.components.get(''solar'')
        %} · export {{ energy(row.export_kwh) }} · curtailment {{ energy(row.curtailed_kwh) }}{% endif %}.


        {% if row.battery_soc is number %}**Modeled ending battery:** {{ row.battery_soc | round(1) }}%.


        {% endif %}{% for period in row.periods %}- {{ period.label }}: {% if period.battery %}{{ {''hold'': ''Save
        battery'', ''serve'': ''Supply home'', ''charge'': ''Charge from grid''}.get(period.battery, ''Unknown action'')
        }} · {% endif %}{{ {''economic'': ''Within dependable economic coverage'', ''outlook'': ''Conservative later
        outlook'', ''fallback'': ''Price-data fallback baseline''}.get(period.coverage) }}.

        {% endfor %}{% for window in row.ev_windows %}- {{ window.label }}: EV charging at {{ window.amps | round(0)
        }} A; selected charging run ends {{ window.stop_label }}.

        {% endfor %}{% for reason in row.reasons %}- **Unavailable:** {{ reason }}

        {% endfor %}

        </details>


        {% endfor %}</details>

        {% endif %}'
