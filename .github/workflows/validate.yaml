name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  public:

permissions:
  contents: read

jobs:
  tests-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -B -m pip_audit --progress-spinner off
      - run: python -B tools/check_privacy.py --history
      - run: python -B -m ruff check . --select F
      - run: python -B -m pytest -q
      - name: Reproduce bundled assets
        run: |
          python -B tools/build_ui.py
          python -B tools/build_brand.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - run: git diff --check
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6
  hacs:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
