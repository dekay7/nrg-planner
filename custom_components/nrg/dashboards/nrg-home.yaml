        - condition: numeric_state
          entity: sensor.nrg_ev_needed
          above: 0
        card:
          type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: sensor.nrg_next_charge
            name: Planned start
            tap_action:
              action: more-info
            hold_action:
              action: none
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.nrg_completion
            name: Expected ready
            tap_action:
