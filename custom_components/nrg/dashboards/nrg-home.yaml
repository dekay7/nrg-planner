          in_header: false
          legend_value: false
        data_generator: 'const key=''battery_charge_kwh'', component="battery";

          const p=entity?.attributes?.plan, h=entity?.attributes?.hourly;

          if(!Number.isFinite(p?.expires_at) || p.expires_at*1000<=Date.now() || !Array.isArray(h?.rows))return
          [];

          const rows=h.rows.filter(r=>Number.isFinite(r.start) && Number.isFinite(r.end) && r.end>r.start && r.end*1000>Date.now()
          && r.start*1000<end.getTime() && r.end*1000>start.getTime());

          // Keep ALL timestamps aligned, even for known-absent/zero series hidden by the

          // legend. Empty arrays corrupt shared inspection in the pinned ApexCharts.

          const absent=component && p.components?.[component]===false;

          const supported=!component || absent || p.components?.[component]===true;

          return rows.map(r=>{const v=absent?0:r[key];return [(r.start+r.end)*500,supported && r.complete && Number.isFinite(v)
          && v>=0 ? v : null];});'
