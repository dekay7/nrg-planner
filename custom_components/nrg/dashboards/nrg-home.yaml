        use'', ''mixed'': ''Mixed energy sources''}.get(basis, ''Modeled appliance cost'') }}** · not necessarily
        the cheapest grid-price window.{% endif %}

        {% set valuation = state_attr(''sensor.nrg_advice'', ''battery_valuation'') or {} %}

        {% if valuation.get(''comparison_limited'') %}**Limited battery estimate:** permitted refill coverage is
        insufficient. Uncovered energy uses a conservative price reference, not a promised refill. Savings notifications
        are withheld.{% endif %}


        {% set controlled = is_state(''binary_sensor.nrg_ev_control'',''on'') or is_state(''binary_sensor.nrg_battery_control'',''on'')
        %}

        {{ ''Advice only; devices follow their own controls.'' if not controlled else (''Observation: schedules
        are suggestions.'' if state_attr(''sensor.nrg_plan'',''operating_mode'') == ''Observation'' else ''NRG controls
        the enabled devices when their checks pass.'') }}

        [Why this advice?](/nrg-home/why)'
      grid_options:
        columns: full
    - type: markdown
      content: '{{ state_attr(''sensor.nrg_advice'',''reason'') or ''Waiting for a current explanation.'' }}'
      grid_options:
        columns: full
    - type: markdown
      content: '{% set p = state_attr(''sensor.nrg_plan'',''plan'') or {} %}{% set a = p.get(''household'', {})
        %}

        {% if a.get(''best_cost'') is number %}### Selected appliance window

        {% if a.get(''reference_kwh'') is number and a.get(''reference_minutes'') is number %}**Reference appliance:**
        {{ a.reference_kwh | round(2) }} kWh over {{ a.reference_minutes | round(0) }} minutes.{% endif %}


        **Modeled appliance cost:** {{ (a.best_cost * 100) | round(2) }}¢.


        {% if a.get(''grid_import_price'') is number %}**Grid buying price during the window:** {{ (a.grid_import_price
        * 100) | round(2) }}¢/kWh (time-weighted average, supply + delivery).{% endif %}

        {% endif %}

        {% if a.get(''forecast_until'') is number %}**Dependable comparison coverage ends:** {{ a.forecast_until
        | timestamp_custom(''%a %I:%M %p %Z'') }}. Later outlook values do not establish savings for this advice.{%
        endif %}

        {% set v = a.get(''battery_valuation'', {}) %}

        {% if v.get(''usable_stored_kwh'', 0) > 0 %}


        **Battery value basis:** {{ ''Limited — conservative known-price reference for uncovered energy'' if v.get(''comparison_limited'')
        else ''Permitted refill potential'' }}. Charging capability, car demand, battery modes, losses and charging
        power are included. Refill potential is not a promised charging schedule.{% endif %}

        '
      grid_options:
        columns: full
    - type: markdown
      content: '## What the recommendation means

        The green graph segment is a suggested window for your reference appliance. The line is the grid buying
        price, not a claim that solar or stored energy is free.


        **Good time:** now is among the better opportunities. **Use as usual:** moving the load is not worth the
        difference. **Wait:** a sufficiently cheaper complete window is available.


        Normal comfort comes first. Appliance advice never starts a device. Any enabled charging deadline, selected
        charge limit or backup reserve takes priority.


        Solid forecast lines are a published outlook, not a settled bill. Dashed lines are tentative estimates.
        Missing data is never treated as free electricity.


        The administrator can change the reference appliance, rates, schedules and reserve in NRG Planner settings.

        '
      grid_options:
        columns: full
    - type: button
      name: Open the complete household handbook
      show_icon: false
      tap_action:
        action: url
        url_path: /nrg-planner/guide.html?v=05b34621d2b0
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: custom:apexcharts-card
      graph_span: 48h
      span:
        start: minute
      cache: false
      header:
        show: true
        title: Modeled energy plan · next 48 hours
      series:
      - entity: sensor.nrg_plan
        name: Solar
        unit: kW
        yaxis_id: power
        color: '#f59e0b'
        type: line
        curve: stepline
        extend_to: false
        data_generator: 'const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; if(p.components
          && !p.components.solar)return []; return (p.slots||[]).filter(s=>Number.isFinite(s.solar_kwh)).map(s=>[s.start*1000,s.solar_known
          ? s.solar_kwh / s.hours : null]);'
      - entity: sensor.nrg_plan
        name: House
        unit: kW
        yaxis_id: power
        color: '#3b82f6'
        type: line
        curve: stepline
        extend_to: false
        data_generator: const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; return
          (p.slots||[]).filter(s=>Number.isFinite(s.house_kwh)).map(s=>[s.start*1000,s.house_kwh / s.hours]);
      - entity: sensor.nrg_plan
        name: Car
        unit: kW
        yaxis_id: power
        color: '#8b5cf6'
        type: line
        curve: stepline
        extend_to: false
        data_generator: const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; if(p.components
          && !p.components.ev)return []; return (p.slots||[]).filter(s=>Number.isFinite(s.ev_kwh)).map(s=>[s.start*1000,s.ev_kwh
          / s.hours]);
      - entity: sensor.nrg_plan
        name: Battery %
        unit: '%'
        yaxis_id: soc
        color: '#22a06b'
        type: line
        curve: stepline
        extend_to: false
        data_generator: const p=entity?.attributes?.plan; if(!p || p.expires_at*1000<=Date.now())return []; if(p.components
          && !p.components.battery)return []; return (p.slots||[]).filter(s=>Number.isFinite(s.battery_soc)).map(s=>[s.start*1000,s.battery_soc]);
      yaxis:
      - id: power
        min: 0
        decimals: 1
      - id: soc
        opposite: true
        min: 0
        max: 100
      apex_config:
        chart:
          height: 300
        legend:
          showForNullSeries: false
        xaxis:
          labels:
            datetimeUTC: false
      grid_options:
        columns: full
    - type: conditional
      conditions:
      - entity: binary_sensor.nrg_has_battery
        state: 'on'
      card:
        type: markdown
        content: '{% set p = state_attr(''sensor.nrg_plan'',''plan'') or {} %}

          {% if not p %}Waiting for a fresh battery forecast.

          {% elif p.get(''battery_forecast_available'') == false %}**Battery line unavailable.** {{ p.get(''battery_reason'',
          ''Check the mapped battery inputs and protection guards.'') }}

          {% else %}**Battery %** is the proposed NRG schedule, including in Observation. It is not a prediction
          of another controller''s actual behavior.{% endif %}'
      grid_options:
        columns: full
    - type: grid
      columns: 2
      square: false
      cards:
      - type: conditional
        conditions:
        - entity: binary_sensor.nrg_battery_control
          state: 'on'
        card:
          type: tile
          entity: sensor.nrg_battery_action
          name: Battery plan
          tap_action:
            action: more-info
          hold_action:
            action: none
          icon_tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.nrg_has_battery
          state: 'on'
        card:
          type: tile
          entity: sensor.nrg_available_energy
          name: Available for home
          tap_action:
            action: more-info
          hold_action:
            action: none
          icon_tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.nrg_ev_control
          state: 'on'
        card:
          type: tile
          entity: sensor.nrg_ev_shortfall
          name: Departure shortfall
          tap_action:
            action: more-info
          hold_action:
            action: none
          icon_tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.nrg_has_solar
          state: 'on'
        card:
          type: tile
          entity: sensor.nrg_source_health
          name: Forecast sources
          tap_action:
            action: more-info
          hold_action:
            action: none
          icon_tap_action:
            action: more-info
      grid_options:
        columns: full
