      name: Electricity price · supply + delivery
      graph: line
      detail: 2
      icon: mdi:lightning-bolt
      grid_options:
        columns: full
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.nrg_supply_price
        name: Supply
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon_tap_action:
          action: more-info
      - type: tile
