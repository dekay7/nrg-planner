      show_icon: false
      tap_action: *id001
      grid_options:
        columns: full
        rows: 1
    - type: markdown
      content: '### Pricing schedule coverage


        {{ states(''sensor.nrg_tariff_status'') }}'
      tap_action:
        action: more-info
        entity: sensor.nrg_tariff_status
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Supply periods
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: '{% set rows = state_attr(''sensor.nrg_tariff_status'',''supply_periods'') or [] %}

        {% if rows %}{% for p in rows %}### {{ p.label }}


        **Time:** {{ p.start }} – {{ p.end }}


        **Rate:** {{ (p.rate_cents ~ '' ¢/kWh'') if p.rate_cents is number else ''Enter rate'' }}


        **Starting days:** {{ p.days | join('', '') }}


        {% if not loop.last %}---


