              if(!Number.isFinite(t))return value;\nif(h?.locale?.time_zone==='server'){\n  const now=new Date(),\
              \ offset=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'longOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName').value;\n\
              \  const m=offset.match(/GMT([+-])(\\d{2}):(\\d{2})/), home=m?(m[1]==='-'?-1:1)*(Number(m[2])*60+Number(m[3])):0;\n\
              \  t+=(-now.getTimezoneOffset()-home)*60000;\n}\nconst row=h?.states?.['sensor.nrg_plan']?.attributes?.hourly?.rows?.find(r=>Math.abs((r.start+r.end)*500-t)<1);\n\
