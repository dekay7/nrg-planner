title: NRG Planner settings
views:
- title: Operation
  path: operation
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Planner controls
      heading_style: title
      grid_options:
        columns: full
        rows: auto
    - type: markdown
      content: 'Enable only the components this home has, and choose separately whether NRG may control them.


        [Household handbook and settings reference](/nrg-planner/guide.html?v=5c852db5b500)'
      grid_options:
        columns: full
        rows: auto
    - type: vertical-stack
      cards:
      - type: markdown
        content: '### Operating mode


          Observation calculates without equipment commands. Control authorizes only the components you enabled
          for NRG control. Switching to Observation does not restore settings already saved in your equipment.'
      - type: entities
        entities:
        - entity: select.nrg_mode
          name: Operating mode
        show_header_toggle: false
      grid_options:
        columns: full
        rows: auto
    - type: entities
      show_header_toggle: false
      entities:
      - entity: button.nrg_refresh
        name: Refresh forecasts
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - entity: binary_sensor.nrg_ev_control
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: heading
          heading: EV overrides
          heading_style: title
        - type: entities
          show_header_toggle: false
          entities:
          - entity: switch.nrg_charge_now
            name: Charge now · ignore price
        - type: tile
          entity: datetime.nrg_departure_override
          name: One-off departure
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
        - type: entities
          show_header_toggle: false
          entities:
          - entity: button.nrg_clear_departure
            name: Clear one-off departure
      grid_options:
        columns: full
        rows: auto
  - type: grid
