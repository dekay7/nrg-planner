      yaxis:
      - decimals: 1
        apex_config:
          title:
            text: ¢/kWh
      apex_config:
        chart:
          height: 290
          animations:
            enabled: false
          events:
            mounted: "EVAL:function(ctx) {\n      const svg=ctx.el.querySelector('.apexcharts-svg'); if(!svg ||\
              \ svg.dataset.nrgTouch)return;\n      svg.dataset.nrgTouch='on'; let timer,multiple=false;\n     \
              \ const show=p=>svg.isConnected && svg.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,view:window,clientX:p.clientX,clientY:p.clientY}));\n\
              \      const move=e=>{clearTimeout(timer);if(e.touches.length!==1){multiple=true;return;}if(!multiple)show(e.touches[0]);};\n\
