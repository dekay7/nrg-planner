# Generated by tools/build_ui.py.
title: NRG Planner
views:
- title: Home Energy
  path: now
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: sensor
      entity: sensor.nrg_import_price
      name: Electricity price · supply + delivery
      graph: line
      detail: 2
      icon: mdi:lightning-bolt
      grid_options:
        columns: full
    - type: tile
      entity: sensor.nrg_pricing_health
      name: Pricing health
      tap_action:
        action: more-info
      hold_action:
        action: none
      icon_tap_action:
        action: more-info
      grid_options:
        columns: full
    - type: markdown
      content: '{% set active = state_attr(''sensor.nrg_pricing_health'',''active'') %}

        {% set observation = state_attr(''sensor.nrg_pricing_health'',''operating_mode'') == ''Observation'' %}

        {% if active %}**{{ ''Proposed price-data fallback · Observation only'' if observation else ''Price-data
        fallback active · verify device results'' }}.**

        {{ state_attr(''sensor.nrg_pricing_health'',''reason'') }}.

        {% if observation %}No equipment commands are sent.{% else %}Configured permissions and protection guards
        still apply; an active policy does not mean every device command succeeded.{% endif %}

        {% if is_state(''sensor.nrg_pricing_health'',''Recovering'') %}Fresh prices have returned, but fallback
        remains active until recovery is confirmed and a new plan is ready.{% endif %}

        {% elif is_state(''sensor.nrg_pricing_health'',''Degraded'') %}**Pricing degraded.** {{ state_attr(''sensor.nrg_pricing_health'',''reason'')
        }}.

        {% if state_attr(''sensor.nrg_pricing_health'',''comed_estimated_price'') %}Published estimate, not a live
        price. Temporary allowance remaining: {{ ((state_attr(''sensor.nrg_pricing_health'',''estimate_seconds_remaining'')
        or 0) / 60) | round(0) }} minutes. Forecast fetched {{ ((state_attr(''sensor.nrg_pricing_health'',''forecast_age_seconds'')
        or 0) / 60) | round(0) }} minutes ago. EV planning can continue; battery grid charging is blocked.{% else
        %}Check the last valid observation and source status.{% endif %}

        {% endif %}

        {% if is_state(''binary_sensor.nrg_fallback_manual'',''on'') %}**Manual request saved.** It persists across
        restarts until ended, even if prices recover. {% if is_state(''binary_sensor.nrg_fallback_enabled'',''off'')
        %}It is currently inactive under Standard protection; end it before selecting fallback again if you do not
        want it to resume.{% endif %}{% endif %}

        {% if active or is_state(''sensor.nrg_pricing_health'',''Degraded'') %}[Review price-data fallback](/nrg-settings/fallback).{%
        endif %}'
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.nrg_pricing_health
          state:
          - Degraded
          - Fallback
          - Recovering
        - condition: state
          entity: binary_sensor.nrg_fallback_manual
          state: 'on'
      grid_options:
        columns: full
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.nrg_supply_price
        name: Supply
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon_tap_action:
          action: more-info
      - type: tile
        entity: sensor.nrg_delivery_price
        name: Delivery
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon_tap_action:
          action: more-info
      grid_options:
        columns: full
    - type: markdown
      content: '## {{ states(''sensor.nrg_advice'') }}

        {% set category = state_attr(''sensor.nrg_advice'',''category'') %}

        {% if category == ''wait'' %}A cheaper window is forecast for a flexible task. Use energy now if you need
        it.

        {% elif category == ''good'' %}If you have a flexible task to do, now is a good time.

        {% elif category == ''normal'' %}Use energy whenever it is convenient; moving the task offers little benefit.

        {% else %}Gathering a dependable price, solar and charging outlook.{% endif %}


        {% set benefit = state_attr(''sensor.nrg_advice'', ''saving'') %}{% if category == ''wait'' and benefit
        is number %}Estimated benefit for the reference appliance: **{{ (benefit * 100) | round(1) }}¢**.{% endif
        %}

        {% set basis = state_attr(''sensor.nrg_advice'', ''cost_basis'') %}

        {% if basis %}**{{ {''grid'': ''Grid-supplied use'', ''solar'': ''Direct solar use'', ''battery'': ''Battery-backed
        use'', ''mixed'': ''Mixed energy sources''}.get(basis, ''Modeled appliance cost'') }}** · not necessarily
        the cheapest grid-price window.{% endif %}

        {% set valuation = state_attr(''sensor.nrg_advice'', ''battery_valuation'') or {} %}

        {% if valuation.get(''comparison_limited'') %}**Limited battery estimate:** permitted refill coverage is
        insufficient. Uncovered energy uses a conservative price reference, not a promised refill. Savings notifications
        are withheld.{% endif %}


        {% set controlled = is_state(''binary_sensor.nrg_ev_control'',''on'') or is_state(''binary_sensor.nrg_battery_control'',''on'')
        %}

        {{ ''Advice only; devices follow their own controls.'' if not controlled else (''Observation: schedules
        are suggestions.'' if state_attr(''sensor.nrg_plan'',''operating_mode'') == ''Observation'' else ''NRG controls
        the enabled devices when their checks pass.'') }}

        [Why this advice?](/nrg-home/why)'
      grid_options:
        columns: full
